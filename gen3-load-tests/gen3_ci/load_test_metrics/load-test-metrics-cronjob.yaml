apiVersion: batch/v1
kind: CronJob
metadata:
  name: load-test-metrics
  namespace: default
spec:
  schedule: "*/120 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: ci-metrics-sa
          restartPolicy: OnFailure
          containers:
          - name: load-test-metrics
            image: quay.io/cdis/ci_metrics:master
            env:
              - name: METRICS_DB_DSN
                valueFrom:
                  secretKeyRef:
                    name: ci-metrics-db
                    key: "METRICS_DB_DSN"
            command:
              - /bin/sh
              - -c
              - |
                #!/bin/bash
                set -euo pipefail

                QUEUE_URL="https://sqs.us-east-1.amazonaws.com/707767160287/load-test-metrics-sqs"
                REGION="${AWS_REGION:-us-east-1}"  # fallback if AWS_REGION not set

                JOB_FAILED=false

                while true; do
                    echo "Checking SQS for messages..."

                    RESPONSE=$(aws sqs receive-message \
                        --queue-url "$QUEUE_URL" \
                        --max-number-of-messages 10 \
                        --wait-time-seconds 10 \
                        --visibility-timeout 300 \
                        --region "$REGION")

                    MESSAGES=$(echo "$RESPONSE" | jq -c '.Messages[]?')

                    if [ -z "$MESSAGES" ]; then
                        echo "No more messages found. Exiting."
                        break
                    fi

                    echo "$MESSAGES" | while read -r message; do
                        MESSAGE_ID=$(echo "$message" | jq -r '.MessageId')
                        RECEIPT_HANDLE=$(echo "$message" | jq -r '.ReceiptHandle')
                        BODY=$(echo "$message" | jq -r '.Body')
                        echo "========================================"
                        echo "Processing SQS message"
                        echo "MessageId: $MESSAGE_ID"
                        echo "Body: $BODY"
                        echo "========================================"

                        RUN_DATE=$(echo "$BODY" | jq -r '.run_date')
                        RUN_NUM=$(echo "$BODY" | jq -r '.run_num')
                        ATTEMPT_NUM=$(echo "$BODY" | jq -r '.attempt_num')
                        RELEASE_VERSION=$(echo "$BODY" | jq -r '.release_version')
                        SUITE=$(echo "$BODY" | jq -r '.test_suite')
                        CASE=$(echo "$BODY" | jq -r '.test_case')
                        RESULT=$(echo "$BODY" | jq -r '.result')
                        CHECKS_FAILS=$(echo "$BODY" | jq -r '.checks_fails')
                        CHECKS_PASSES=$(echo "$BODY" | jq -r '.checks_passes')
                        CHECKS_VALUE=$(echo "$BODY" | jq -r '.checks_value')
                        HTTP_REQ_DURATION_AVG=$(echo "$BODY" | jq -r '.http_req_duration_avg')
                        HTTP_REQ_DURATION_MIN=$(echo "$BODY" | jq -r '.http_req_duration_min')
                        HTTP_REQ_DURATION_MED=$(echo "$BODY" | jq -r '.http_req_duration_med')
                        HTTP_REQ_DURATION_MAX=$(echo "$BODY" | jq -r '.http_req_duration_max')
                        HTTP_REQ_DURATION_P90=$(echo "$BODY" | jq -r '.http_req_duration_p90')
                        HTTP_REQ_DURATION_P95=$(echo "$BODY" | jq -r '.http_req_duration_p95')
                        DATA_SENT_COUNT=$(echo "$BODY" | jq -r '.data_sent_count')
                        DATA_SENT_RATE=$(echo "$BODY" | jq -r '.data_sent_rate')
                        ITERATIONS_COUNT=$(echo "$BODY" | jq -r '.iterations_count')
                        ITERATIONS_RATE=$(echo "$BODY" | jq -r '.iterations_rate')
                        BULK_OBJECTS_REQUESTED_COUNT=$(echo "$BODY" | jq -r '.bulk_objects_requested_count')
                        BULK_OBJECTS_REQUESTED_RATE=$(echo "$BODY" | jq -r '.bulk_objects_requested_rate')
                        BULK_OBJECTS_RESOLVED_COUNT=$(echo "$BODY" | jq -r '.bulk_objects_resolved_count')
                        BULK_OBJECTS_RESOLVED_RATE=$(echo "$BODY" | jq -r '.bulk_objects_resolved_rate')
                        BULK_OBJECTS_UNRESOLVED_COUNT=$(echo "$BODY" | jq -r '.bulk_objects_unresolved_count')
                        BULK_OBJECTS_UNRESOLVED_RATE=$(echo "$BODY" | jq -r '.bulk_objects_unresolved_rate')

                        echo "Inserting message $MESSAGE_ID into PostgreSQL..."

                        if psql "$METRICS_DB_DSN" <<EOF
                INSERT INTO load_test_metrics_data (
                    run_date,
                    run_num,
                    attempt_num,
                    release_version,
                    test_suite,
                    test_case,
                    result,
                    checks_fails,
                    checks_passes,
                    checks_value,
                    http_req_duration_avg,
                    http_req_duration_min,
                    http_req_duration_med,
                    http_req_duration_max,
                    http_req_duration_p90,
                    http_req_duration_p95,
                    data_sent_count,
                    data_sent_rate,
                    iterations_count,
                    iterations_rate,
                    bulk_objects_requested_count,
                    bulk_objects_requested_rate,
                    bulk_objects_resolved_count,
                    bulk_objects_resolved_rate,
                    bulk_objects_unresolved_count,
                    bulk_objects_unresolved_rate
                ) VALUES (
                    '$RUN_DATE',
                    $RUN_NUM,
                    $ATTEMPT_NUM,
                    '$RELEASE_VERSION',
                    '$SUITE',
                    '$CASE',
                    '$RESULT',
                    $CHECKS_FAILS,
                    $CHECKS_PASSES,
                    $CHECKS_VALUE,
                    $HTTP_REQ_DURATION_AVG,
                    $HTTP_REQ_DURATION_MIN,
                    $HTTP_REQ_DURATION_MED,
                    $HTTP_REQ_DURATION_MAX,
                    $HTTP_REQ_DURATION_P90,
                    $HTTP_REQ_DURATION_P95,
                    $DATA_SENT_COUNT,
                    $DATA_SENT_RATE,
                    $ITERATIONS_COUNT,
                    $ITERATIONS_RATE,
                    $BULK_OBJECTS_REQUESTED_COUNT,
                    $BULK_OBJECTS_REQUESTED_RATE,
                    $BULK_OBJECTS_RESOLVED_COUNT,
                    $BULK_OBJECTS_RESOLVED_RATE,
                    $BULK_OBJECTS_UNRESOLVED_COUNT,
                    $BULK_OBJECTS_UNRESOLVED_RATE
                )
                ON CONFLICT (
                    run_date,
                    run_num,
                    attempt_num,
                    release_version,
                    test_suite,
                    test_case
                )
                DO NOTHING;
                EOF
                        then
                            echo "PostgreSQL processing succeeded for message $MESSAGE_ID"
                            echo "Deleting SQS message $MESSAGE_ID..."

                            if aws sqs delete-message \
                                --queue-url "$QUEUE_URL" \
                                --receipt-handle "$RECEIPT_HANDLE" \
                                --region "$REGION"; then

                                echo "Message $MESSAGE_ID processed and deleted successfully."
                            else
                                echo "ERROR: Failed to delete SQS message $MESSAGE_ID."
                                echo "The message may become visible again and be retried."
                            fi
                        else
                            echo "ERROR: PostgreSQL processing failed for message $MESSAGE_ID."
                            echo "SQS message will NOT be deleted."
                            JOB_FAILED=true
                        fi
                    done
                done

                if [ "$JOB_FAILED" = true ]; then
                    echo "ERROR: One or more messages failed."
                    exit 1
                fi
                echo "Finished processing all messages."
                exit 0
