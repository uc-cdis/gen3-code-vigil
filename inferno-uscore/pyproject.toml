[tool.poetry]
name = "inferno-uscore"
version = "0.1.0"
description = "Inferno US Core v6.1.0 integration tests for gen3-fhir-proxy"
authors = ["CTDS UChicago <cdis@uchicago.edu>"]
license = "Apache-2.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.27"
pytest = "^8"
pytest-timeout = "^2.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests/"]
python_files = ["test_*.py"]
addopts = "-ra -v"
timeout = 7200
markers = [
  "inferno_uscore: Inferno US Core v6.1.0 test suite (requires Inferno server and gen3-fhir-proxy)",
]
