apiVersion: v1
kind: ServiceAccount
metadata:
  name: failure-analysis-service-account
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRoleArn }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: failure-analysis-role
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/log
      - configmaps
      - namespaces
    verbs:
      - get
      - list
      - create
      - patch

  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - create
      - delete
      - watch
      - patch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
    verbs:
      - get
      - list
      - create
      - delete
      - watch
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: failure-analysis-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: failure-analysis-role
subjects:
  - kind: ServiceAccount
    name: failure-analysis-service-account
    namespace: {{ .Release.Namespace }}
