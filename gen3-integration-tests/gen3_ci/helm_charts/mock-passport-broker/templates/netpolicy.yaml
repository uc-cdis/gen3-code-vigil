{{- if .Values.netPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mock-passport-broker.fullname" . }}-ingress-netpolicy
  labels:
    {{- include "mock-passport-broker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mock-passport-broker.selectorLabels" . | nindent 6 }}
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: {{- toYaml .Values.netPolicy.ingressApps | nindent 18 }}
  policyTypes:
    - Ingress
{{- end }}
