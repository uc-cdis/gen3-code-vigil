{{- if not .Values.signingKey.existingSecret }}
{{- $secretName := include "mock-passport-broker.secretName" . }}
{{- /* reuse the key from a previous install, so tokens signed before an upgrade stay valid */}}
{{- $privateKey := "" }}
{{- with lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $privateKey = index .data "private_key.pem" | default "" }}
{{- end }}
{{- if not $privateKey }}
{{- $privateKey = genPrivateKey "rsa" | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mock-passport-broker.labels" . | nindent 4 }}
type: Opaque
data:
  private_key.pem: {{ $privateKey }}
{{- end }}
