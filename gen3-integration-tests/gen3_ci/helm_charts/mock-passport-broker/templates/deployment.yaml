apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mock-passport-broker.fullname" . }}-deployment
  labels:
    {{- include "mock-passport-broker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "mock-passport-broker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/server: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mock-passport-broker.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: server
          configMap:
            name: {{ include "mock-passport-broker.fullname" . }}-server
        - name: signing-key
          secret:
            secretName: {{ include "mock-passport-broker.secretName" . }}
            items:
              - key: {{ include "mock-passport-broker.secretKey" . }}
                path: private_key.pem
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python3
            - /app/server.py
          env:
            - name: ISSUER
              value: {{ include "mock-passport-broker.issuer" . | quote }}
            - name: KID
              value: {{ .Values.kid | quote }}
            - name: KEY_PATH
              value: /signing-key/private_key.pem
            - name: PORT
              value: {{ .Values.containerPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /_status
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: server
              mountPath: /app
              readOnly: true
            - name: signing-key
              mountPath: /signing-key
              readOnly: true
